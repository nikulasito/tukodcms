<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Higalaay Festival featured events and calendar of events for Cagayan de Oro visitors."
    />
    <title>Events | Higalaay Festival</title>
    <link rel="icon" href="../assets/higalaay_logo.png" type="image/png" />
    <link rel="stylesheet" href="../assets/styles.css?v=20260806-1" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../" aria-label="Higalaay Festival home">
        <img
          class="brand-logo"
          src="../assets/higalaay_logo.png"
          alt="Higalaay Festival"
        />
        <span>
          <strong>Higalaay Festival</strong>
          <small>Cagayan de Oro</small>
        </span>
      </a>
      <button
        class="nav-toggle"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="../">Home</a>
        <a href="../about/">About Higalaay</a>
        <a href="../events/" aria-current="page">Events</a>
        <a href="../sponsor/">Be a Partner</a>
        <a href="../contact/">Contact Us</a>
      </nav>
    </header>

    <main>
      <div data-tukod-slot-anchor="events-hero" hidden></div>

      <div data-tukod-slot-anchor="events-partner-recognition" hidden></div>

      <div data-tukod-slot-anchor="featured-events" hidden></div>

      <div data-tukod-slot-anchor="calendar-section" hidden></div>

      <div data-tukod-slot-anchor="volunteer-cta" hidden></div>
    </main>

    <div class="modal-shell" id="volunteer-modal" aria-hidden="true">
      <div class="modal-backdrop" data-modal-close></div>
      <section
        class="partner-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="volunteer-modal-title"
      >
        <button
          class="modal-close"
          type="button"
          aria-label="Close volunteer form"
          data-modal-close
        >
          <span></span>
          <span></span>
        </button>
        <div class="modal-copy">
          <p class="eyebrow">Volunteer Interest</p>
          <h2 id="volunteer-modal-title">Tell us how you want to help</h2>
          <p>
            Share your contact details and a short message so the Higalaay team
            can connect you with volunteer opportunities for the event.
          </p>
        </div>
        <form
          class="partner-form"
          data-success="Thanks. Your volunteer interest has been noted for follow-up."
        >
          <div class="form-grid">
            <label>
              Name
              <input
                type="text"
                name="first_name"
                autocomplete="given-name"
                required
              />
            </label>
            <label>
              Last name
              <input
                type="text"
                name="last_name"
                autocomplete="family-name"
                required
              />
            </label>
            <label>
              Phone
              <input type="tel" name="phone" autocomplete="tel" required />
            </label>
            <label>
              Email
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="full-field">
              Affiliation
              <input
                type="text"
                name="affiliation"
                autocomplete="organization"
                required
              />
            </label>
            <label class="full-field">
              Message
              <textarea
                name="message"
                rows="5"
                placeholder="Tell us your availability, interests, or how you would like to help."
              ></textarea>
            </label>
          </div>
          <div class="modal-actions">
            <button class="button volunteer-button" type="submit">
              Submit Volunteer Interest
            </button>
          </div>
          <p class="form-status" aria-live="polite"></p>
        </form>
      </section>
    </div>

    <footer class="site-footer" data-tukod-global-footer hidden></footer>

    <script src="../assets/main.js?v=20260806-1"></script>
    <script src="../cms-config.js?v=20260806-1"></script>
    <script src="../tukod-cms-client.js?v=20260806-1" defer></script>
  </body>
</html>
